name: Check template

on:
  push:
    branches: [dev, main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check schema, manifest and templates
        run: python3 scripts/check.py
      - name: Check the example vault
        run: python3 scripts/check.py --vault examples/synthetic-vault --schema navigation/Knowledge-graph.md
      - name: Test the checker
        run: python3 -m unittest discover -s tests -v
